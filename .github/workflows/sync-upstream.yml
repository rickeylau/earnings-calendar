
name: Sync Upstream

on:
  schedule:
    # 每周日 UTC 03:15
    - cron: "15 3 * * 0"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream \
            https://github.com/bowencool/earnings-calendar.git

          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date."
            exit 0
          fi

          # Merge without force or automatic commit
          if ! git merge --no-commit --no-ff upstream/main; then
            git merge --abort
            echo "::error::Merge conflict. Manual review required."
            exit 1
          fi

          # Protect custom configuration and workflows
          if ! git diff --cached --quiet -- .github/; then
            git merge --abort
            echo "::error::GitHub configuration changed. Manual review required."
            exit 1
          fi

          git commit -m "chore: sync upstream code"
          git push origin main
